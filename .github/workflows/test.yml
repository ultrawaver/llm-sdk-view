name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[test]'
      # Pinned to an exact commit of the contribution branch, because the
      # released llm-anthropic cannot express response_inclusion yet. Replace
      # with the plain PyPI dependency once it is merged upstream.
      - run: pip install 'git+https://github.com/ultrawaver/llm-anthropic@1fe612526d89b1f381a6e480a3d32e05614103dd'
      - run: pytest
      - run: ruff check .
