<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM SDK View</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #10141b; color: #e8edf2; }
    header { padding: 14px 18px; border-bottom: 1px solid #2d3540; font-weight: 700; }
    main { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 50px); }
    section { padding: 18px; min-width: 0; display: flex; flex-direction: column; }
    section + section { border-left: 1px solid #2d3540; background: #0b0f14; }
    h2 { margin-top: 0; font-size: 16px; }
    textarea, input, select, button { font: inherit; }
    textarea { width: 100%; min-height: 110px; resize: vertical; padding: 12px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
    label { display: grid; gap: 5px; font-size: 13px; color: #aab6c3; }
    input, select { padding: 8px; }
    input:disabled, select:disabled { opacity: .45; }
    button { padding: 10px 14px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px; border: 1px solid #2d3540; border-radius: 8px; min-height: 280px; flex: 1; margin: 0; }
    .notice, .status { color: #9fb7d0; font-size: 13px; margin: 6px 0; }
    .status b { color: #e8edf2; }
    .blocked { color: #ffc27a; font-size: 13px; margin: 6px 0; min-height: 18px; }
    #log { flex: 1; overflow-y: auto; border: 1px solid #2d3540; border-radius: 8px; padding: 12px; min-height: 200px; }
    .msg { margin-bottom: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg .who { font-size: 12px; color: #7f8c99; text-transform: uppercase; letter-spacing: .04em; }
    .msg.user .who { color: #8fd0ff; }
    .msg.assistant .who { color: #9ee6b4; }
    .error { color: #ff9b9b; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } section + section { border-left: 0; border-top: 1px solid #2d3540; } }
  </style>
</head>
<body>
  <header>LLM SDK View</header>
  <main>
    <section>
      <h2>Chat</h2>
      <p class="notice">Each turn goes through <code>llm.Conversation</code> and
        <code>llm-anthropic</code>. The right pane shows the request that will
        actually be sent.</p>
      <div id="log"></div>
      <textarea id="prompt" placeholder="Ask a current architecture question..."></textarea>
      <div class="controls">
        <label>Model<input id="model" value="claude-sonnet-5"></label>
        <label>Max output tokens
          <input id="maxTokens" type="number" value="16384" min="1">
          <span class="notice" id="maxTokensHint"></span>
        </label>
        <label>System
          <input id="system" placeholder="omitted from the request when empty">
        </label>
        <label>Web search
          <select id="webSearch"><option value="true">ON</option><option value="false">OFF</option></select>
        </label>
        <label>Web search type
          <select id="webSearchType">
            <option value="web_search_20260318">web_search_20260318</option>
            <option value="web_search_20250305">web_search_20250305</option>
          </select>
        </label>
        <label>Allowed callers
          <select id="allowedCallers">
            <option value="code_execution_20260120">code_execution_20260120</option>
            <option value="direct">direct</option>
          </select>
        </label>
        <label>Response inclusion
          <select id="responseInclusion"><option value="excluded">excluded</option><option value="full">full</option></select>
          <span class="notice" id="responseInclusionNote"></span>
        </label>
        <label>Max uses
          <input id="maxUses" type="number" value="1" min="0">
          <span class="notice">0 = unlimited (the field is then omitted)</span>
        </label>
        <label>Prompt cache
          <select id="cacheControl"><option value="true">ON</option><option value="false">OFF</option></select>
          <span class="notice" id="ttlNote"></span>
        </label>
      </div>
      <p class="status">Dynamic filtering: <b id="dynamicFiltering">active</b>
        <span id="dynamicFilteringNote"></span></p>
      <p class="blocked" id="blockedNote"></p>
      <button id="send">Send</button>
    </section>
    <section>
      <h2>Anthropic Python SDK</h2>
      <pre id="code">Send a message to see the equivalent SDK call.</pre>
    </section>
  </main>
  <script>
    const byId = (id) => document.getElementById(id);
    const log = byId('log');
    const state = { sent: false, caps: null };
    const DYNAMIC = 'code_execution_20260120';
    let streaming = false;

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = '<div class="who"></div><div class="body"></div>';
      div.querySelector('.who').textContent = role;
      div.querySelector('.body').textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div.querySelector('.body');
    }

    function payload(text) {
      return {
        session_id: 'default',
        text,
        model: byId('model').value.trim(),
        max_tokens: Number(byId('maxTokens').value),
        system: byId('system').value,
        web_search: byId('webSearch').value === 'true',
        web_search_type: byId('webSearchType').value,
        allowed_callers: byId('allowedCallers').value,
        response_inclusion: byId('responseInclusion').value,
        max_uses: Number(byId('maxUses').value),
        cache_control: byId('cacheControl').value === 'true'
      };
    }

    function refresh() {
      const on = byId('webSearch').value === 'true';
      ['webSearchType', 'allowedCallers', 'responseInclusion', 'maxUses'].forEach(
        (id) => { byId(id).disabled = !on; }
      );
      // response_inclusion is only accepted by web_search_20260318, and only
      // when the installed llm-anthropic can send it at all.
      const inclusionOk = state.caps ? state.caps.response_inclusion : true;
      byId('responseInclusion').disabled =
        !on || byId('webSearchType').value !== 'web_search_20260318' || !inclusionOk;

      let text, note, blocked = false;
      if (!on) {
        text = 'off';
        note = 'No web search tool is sent.';
      } else if (byId('allowedCallers').value === 'direct') {
        text = 'disabled';
        blocked = !state.sent;
        note = blocked
          ? 'Direct search needs allowed_callers=["direct"], which the installed llm-anthropic cannot send. Sending is blocked instead of silently falling back.'
          : 'allowed_callers=["direct"] is sent, which turns dynamic filtering off.';
      } else {
        text = 'active';
        note = state.sent
          ? 'allowed_callers=["' + DYNAMIC + '"] is sent.'
          : 'allowed_callers is not sent, so the API default ' + DYNAMIC + ' applies.';
      }
      byId('dynamicFiltering').textContent = text;
      byId('dynamicFilteringNote').textContent = note;
      byId('blockedNote').textContent = blocked ? note : '';
      byId('send').disabled = blocked;
    }

    function apply(data) {
      byId('maxTokens').max = data.model.max_tokens || '';
      byId('maxTokensHint').textContent = data.model.max_tokens
        ? 'at most ' + data.model.max_tokens + ' for ' + data.model.id
        : '';
      // llm-anthropic derives the tool version from the model, so only the
      // version this model actually emits is selectable.
      Array.from(byId('webSearchType').options).forEach((option) => {
        const used = option.value === data.model.web_search_type;
        option.disabled = !used;
        option.textContent = used ? option.value : option.value + ' (not used by ' + data.model.id + ')';
      });
      if (byId('webSearchType').value !== data.model.web_search_type) {
        byId('webSearchType').value = data.model.web_search_type;
      }
      Array.from(byId('allowedCallers').options).forEach((option) => {
        if (option.value === data.allowed_callers.api_default) {
          option.textContent = option.value + ' (API default'
            + (data.allowed_callers.sent ? '' : ', not sent') + ')';
        } else {
          option.textContent = option.value;
        }
      });
      byId('ttlNote').textContent = data.cache_ttl.note;
      byId('responseInclusionNote').textContent = data.capabilities.response_inclusion
        ? 'only sent for web_search_20260318'
        : 'the installed llm-anthropic cannot send response_inclusion, so it is omitted';
      state.sent = data.allowed_callers.sent;
      state.caps = data.capabilities;
      refresh();
    }

    async function loadForm() {
      const model = byId('model').value.trim() || 'claude-sonnet-5';
      const response = await fetch('/api/form?model=' + encodeURIComponent(model));
      const data = await response.json();
      if (data.error) {
        byId('maxTokensHint').textContent = data.error;
        byId('blockedNote').textContent = data.error;
        byId('send').disabled = true;
        return;
      }
      apply(data);
    }

    ['webSearch', 'webSearchType', 'allowedCallers'].forEach(
      (id) => byId(id).addEventListener('change', refresh)
    );
    byId('model').addEventListener('change', loadForm);

    byId('send').addEventListener('click', async () => {
      if (streaming || byId('send').disabled) return;
      const text = byId('prompt').value.trim();
      if (!text) return;
      streaming = true;
      addMessage('user', text);
      byId('prompt').value = '';
      const body = addMessage('assistant', '');

      const response = await fetch('/api/chat/stream', {
        method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(payload(text))
      });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          const event = JSON.parse(part.slice(6));
          if (event.type === 'prepared') {
            byId('code').textContent = event.code;
            // The truth about dynamic filtering is what went on the request.
            byId('dynamicFiltering').textContent = event.dynamic_filtering;
            byId('dynamicFilteringNote').textContent = 'read from the request that was sent';
          } else if (event.type === 'text') {
            body.textContent += event.text;
            log.scrollTop = log.scrollHeight;
          } else if (event.type === 'error') {
            body.innerHTML = '';
            body.className = 'error';
            body.textContent = event.error === 'missing_api_key'
              ? 'No Anthropic key found. Nothing was sent. Set one with: llm keys set anthropic'
              : event.error;
          }
        }
      }
      streaming = false;
    });

    loadForm();
  </script>
</body>
</html>
