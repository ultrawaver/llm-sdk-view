<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM SDK View</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #10141b; color: #e8edf2; }
    header { padding: 14px 18px; border-bottom: 1px solid #2d3540; font-weight: 700; }
    main { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 50px); }
    section { padding: 18px; min-width: 0; display: flex; flex-direction: column; }
    section + section { border-left: 1px solid #2d3540; background: #0b0f14; }
    h2 { margin-top: 0; font-size: 16px; }
    textarea, input, select, button { font: inherit; }
    textarea { width: 100%; min-height: 110px; resize: vertical; padding: 12px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
    label { display: grid; gap: 5px; font-size: 13px; color: #aab6c3; }
    input, select { padding: 8px; }
    input:disabled, select:disabled { opacity: .45; }
    button { padding: 10px 14px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px; border: 1px solid #2d3540; border-radius: 8px; min-height: 280px; flex: 1; margin: 0; }
    .notice, .status { color: #9fb7d0; font-size: 13px; margin: 6px 0; }
    .status b { color: #e8edf2; }
    .blocked { color: #ffc27a; font-size: 13px; margin: 6px 0; min-height: 18px; }
    #log { flex: 1; overflow-y: auto; border: 1px solid #2d3540; border-radius: 8px; padding: 12px; min-height: 200px; }
    .msg { margin-bottom: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg .who { font-size: 12px; color: #7f8c99; text-transform: uppercase; letter-spacing: .04em; }
    .msg.user .who { color: #8fd0ff; }
    .msg.assistant .who { color: #9ee6b4; }
    .error { color: #ff9b9b; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } section + section { border-left: 0; border-top: 1px solid #2d3540; } }
  </style>
</head>
<body>
  <header>LLM SDK View</header>
  <main>
    <section>
      <h2>Chat</h2>
      <p class="notice">Each turn goes through <code>llm.Conversation</code> and
        <code>llm-anthropic</code>. The right pane shows the request that will
        actually be sent.</p>
      <div id="log"></div>
      <textarea id="prompt" placeholder="Ask a current architecture question..."></textarea>
      <div class="controls">
        <label>Model
          <select id="model"></select>
          <span class="notice" id="contextWindow"></span>
        </label>
        <label>Max output tokens
          <input id="maxTokens" type="number" value="16384" min="1">
          <span class="notice" id="maxTokensHint"></span>
        </label>
        <label>System
          <input id="system" placeholder="omitted from the request when empty">
        </label>
        <label>Effort
          <select id="effort"></select>
          <span class="notice" id="effortNote"></span>
        </label>
        <label>Web search
          <select id="webSearch"><option value="true">ON</option><option value="false">OFF</option></select>
        </label>
        <label>Web search type
          <select id="webSearchType"></select>
          <span class="notice" id="webSearchTypeNote"></span>
        </label>
        <label>Allowed callers
          <select id="allowedCallers"></select>
        </label>
        <label>Response inclusion
          <select id="responseInclusion"><option value="excluded">excluded</option><option value="full">full</option></select>
          <span class="notice" id="responseInclusionNote"></span>
        </label>
        <label>Max uses
          <input id="maxUses" type="number" value="1" min="0">
          <span class="notice">0 = unlimited (the field is then omitted)</span>
        </label>
        <label>Prompt cache
          <select id="cacheControl"><option value="true">ON</option><option value="false">OFF</option></select>
          <span class="notice" id="ttlNote"></span>
        </label>
        <label>Streaming
          <select id="stream"><option value="true">ON</option><option value="false">OFF</option></select>
          <span class="notice" id="streamNote"></span>
        </label>
      </div>
      <p class="status">Adaptive thinking: <b id="adaptiveThinking">-</b>
        <span id="thinkingNote"></span></p>
      <p class="status">Model data: <b id="modelDataSource">-</b>
        <span id="modelDataNote"></span></p>
      <p class="status">Dynamic filtering: <b id="dynamicFiltering">active</b>
        <span id="dynamicFilteringNote"></span></p>
      <p class="blocked" id="blockedNote"></p>
      <button id="send">Send</button>
    </section>
    <section>
      <h2>Anthropic Python SDK</h2>
      <pre id="code">Send a message to see the equivalent SDK call.</pre>
    </section>
  </main>
  <script>
    const byId = (id) => document.getElementById(id);
    const log = byId('log');
    const DYNAMIC = 'code_execution_20260120';
    const state = { caps: null };
    let streaming = false;

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = '<div class="who"></div><div class="body"></div>';
      div.querySelector('.who').textContent = role;
      div.querySelector('.body').textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div.querySelector('.body');
    }

    function payload(text) {
      return {
        session_id: 'default',
        text,
        model: byId('model').value,
        max_tokens: Number(byId('maxTokens').value),
        system: byId('system').value,
        effort: byId('effort').value,
        web_search: byId('webSearch').value === 'true',
        web_search_type: byId('webSearchType').value,
        allowed_callers: byId('allowedCallers').value,
        response_inclusion: byId('responseInclusion').value,
        max_uses: Number(byId('maxUses').value),
        cache_control: byId('cacheControl').value === 'true',
        stream: byId('stream').value === 'true'
      };
    }

    function setOptions(select, values, labels, disabled) {
      select.innerHTML = '';
      values.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = labels[value] || value;
        option.disabled = !!disabled[value];
        select.appendChild(option);
      });
    }

    const fmt = (n) => (n === null || n === undefined) ? 'unknown' : n.toLocaleString('en-US');

    function refresh() {
      const caps = state.caps;
      const on = byId('webSearch').value === 'true';
      ['webSearchType', 'allowedCallers', 'responseInclusion', 'maxUses'].forEach(
        (id) => { byId(id).disabled = !on; }
      );
      // response_inclusion only reaches the request when the model's web
      // search tool version accepts it and the plugin can send it.
      byId('responseInclusion').disabled = !on || !caps.response_inclusion;

      let text, note, blocked = false;
      if (!on) {
        text = 'off';
        note = 'No web search tool is sent.';
      } else if (byId('allowedCallers').value === 'direct') {
        text = 'disabled';
        blocked = !caps.allowed_callers;
        note = blocked
          ? 'Direct search needs allowed_callers=["direct"], which the installed llm-anthropic cannot send. Sending is blocked instead of silently falling back.'
          : 'allowed_callers=["direct"] is sent, which turns dynamic filtering off.';
      } else {
        text = 'active';
        note = caps.allowed_callers
          ? 'allowed_callers=["' + DYNAMIC + '"] is sent.'
          : 'allowed_callers is not sent, so the API default ' + DYNAMIC + ' applies.';
      }
      byId('dynamicFiltering').textContent = text;
      byId('dynamicFilteringNote').textContent = note;
      byId('blockedNote').textContent = blocked ? note : '';
      byId('send').disabled = blocked;
    }

    function apply(data) {
      const caps = data.capabilities;
      state.caps = caps;

      byId('contextWindow').textContent = 'context window '
        + fmt(caps.context_window) + ' tokens (Anthropic docs, verified ' + caps.verified + ')';
      byId('maxTokens').max = caps.max_output_tokens || '';
      byId('maxTokensHint').textContent = caps.max_output_tokens
        ? 'at most ' + fmt(caps.max_output_tokens) + ' for ' + caps.id
        : '';
      byId('ttlNote').textContent = data.cache_ttl.note;

      // Streaming controls whether this page shows text as it arrives. It is
      // not a provider parameter: the right pane shows whichever SDK method
      // the plugin really calls, and says so.
      byId('streamNote').textContent = data.transport.sdk_method === 'stream'
        ? data.transport.streaming_note
        : 'the installed plugin calls messages.create() for this model';

      // Provenance: a fallback profile must never look like a live API result.
      const src = data.model_data;
      const label = {
        'models-api': {disk: 'Models API (cached)', live: 'Models API (live)',
                       'stale-disk': 'Models API (stale cache)'}[src.cache] || 'Models API',
        fallback: 'fallback profile ' + src.profile_version
      }[src.source] || src.source;
      byId('modelDataSource').textContent = label;
      byId('modelDataNote').textContent = src.source === 'models-api'
        ? 'fetched ' + (src.fetched_at || 'unknown')
        : 'Models API unavailable (' + (src.error || 'unknown') + ') - showing the '
          + src.profile_version + ' profile, not live data';

      // Adaptive thinking is a property of the model, shown read-only: the
      // reasoning blocks the plugin asks for are display only and change no
      // request parameter the form controls.
      byId('adaptiveThinking').textContent = caps.thinking_mode === 'adaptive'
        ? (caps.thinking_always_on ? 'yes (always on)' : 'yes')
        : caps.thinking_mode;
      byId('thinkingNote').textContent = caps.thinking_mode === 'adaptive'
        ? 'reasoning blocks are display only; no form control changes them'
        : 'this model uses extended thinking; no form control changes it';

      // Effort: the levels come from the plugin, and "off" is only offered
      // where llm-anthropic can really send thinking={"type": "disabled"}.
      const effortLabels = {};
      const effortDisabled = {};
      caps.effort_options.forEach((value) => {
        if (value === 'default') {
          effortLabels[value] = caps.default_effort
            ? 'default (model default: ' + caps.default_effort + ')'
            : 'default';
        } else if (value === 'off') {
          effortLabels[value] = caps.can_disable_thinking
            ? 'off (thinking disabled)'
            : 'off (not supported: this model always thinks)';
          effortDisabled[value] = !caps.can_disable_thinking;
        } else {
          effortLabels[value] = caps.supports_effort
            ? value
            : value + ' (not supported by this model)';
          effortDisabled[value] = !caps.supports_effort;
        }
      });
      setOptions(byId('effort'), caps.effort_options, effortLabels, effortDisabled);
      byId('effort').value = 'default';
      byId('effortNote').textContent = caps.supports_effort
        ? 'sent as output_config.effort'
        : 'this model has no effort parameter, so only default/off apply';

      // llm-anthropic derives the tool version from the model, so only the
      // version this model actually emits is selectable.
      const typeLabels = {};
      const typeDisabled = {};
      data.web_search_types.forEach((value) => {
        const used = value === caps.web_search_type;
        typeLabels[value] = used ? value : value + ' (not used by ' + caps.id + ')';
        typeDisabled[value] = !used;
      });
      setOptions(byId('webSearchType'), data.web_search_types, typeLabels, typeDisabled);
      byId('webSearchType').value = caps.web_search_type || data.web_search_types[0];
      byId('webSearchTypeNote').textContent = caps.web_search_type
        ? 'llm-anthropic picks this from the model'
        : 'this model has no web search tool';

      const callerLabels = {};
      data.allowed_callers.options.forEach((value) => {
        callerLabels[value] = value === data.allowed_callers.api_default
          ? value + ' (API default' + (data.allowed_callers.sent ? '' : ', not sent') + ')'
          : value;
      });
      setOptions(byId('allowedCallers'), data.allowed_callers.options, callerLabels, {});
      byId('allowedCallers').value = data.allowed_callers.api_default;

      byId('responseInclusionNote').textContent = caps.response_inclusion
        ? 'sent for ' + caps.web_search_type
        : 'not sent: ' + (caps.web_search_type === 'web_search_20260318'
            ? 'the installed llm-anthropic cannot express it'
            : caps.web_search_type + ' has no response_inclusion');

      refresh();
    }

    async function loadForm() {
      const model = byId('model').value;
      const query = model ? '?model=' + encodeURIComponent(model) : '';
      const response = await fetch('/api/form' + query);
      const data = await response.json();
      if (data.error) {
        byId('blockedNote').textContent = data.error;
        byId('send').disabled = true;
        return;
      }
      if (!byId('model').options.length) {
        setOptions(byId('model'), data.models, {}, {});
        byId('model').value = data.model.id;
      }
      apply(data);
    }

    ['webSearch', 'webSearchType', 'allowedCallers'].forEach(
      (id) => byId(id).addEventListener('change', refresh)
    );
    byId('model').addEventListener('change', loadForm);

    byId('send').addEventListener('click', async () => {
      if (streaming || byId('send').disabled) return;
      const text = byId('prompt').value.trim();
      if (!text) return;
      streaming = true;
      addMessage('user', text);
      byId('prompt').value = '';
      const body = addMessage('assistant', '');

      const response = await fetch('/api/chat/stream', {
        method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(payload(text))
      });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          const event = JSON.parse(part.slice(6));
          if (event.type === 'prepared') {
            byId('code').textContent = event.code;
            // The truth about dynamic filtering is what went on the request.
            byId('dynamicFiltering').textContent = event.dynamic_filtering;
            byId('dynamicFilteringNote').textContent = 'read from the request that was sent';
          } else if (event.type === 'text') {
            // With streaming off there are no chunks; the reply arrives whole.
            if (byId('stream').value === 'true') {
              body.textContent += event.text;
              log.scrollTop = log.scrollHeight;
            }
          } else if (event.type === 'done') {
            body.textContent = event.text;
            log.scrollTop = log.scrollHeight;
          } else if (event.type === 'error') {
            body.innerHTML = '';
            body.className = 'error';
            body.textContent = event.error === 'missing_api_key'
              ? 'No Anthropic key found. Nothing was sent. Set one with: llm keys set anthropic'
              : event.error;
          }
        }
      }
      streaming = false;
    });

    loadForm();
  </script>
</body>
</html>
