<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM SDK View</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #10141b; color: #e8edf2; }
    header { padding: 14px 18px; border-bottom: 1px solid #2d3540; font-weight: 700; }
    main { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 50px); }
    section { padding: 18px; min-width: 0; display: flex; flex-direction: column; }
    section + section { border-left: 1px solid #2d3540; background: #0b0f14; }
    h2 { margin-top: 0; font-size: 16px; }
    textarea, input, select, button { font: inherit; }
    textarea { width: 100%; min-height: 110px; resize: vertical; padding: 12px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
    label { display: grid; gap: 5px; font-size: 13px; color: #aab6c3; }
    input, select { padding: 8px; }
    input:disabled, select:disabled { opacity: .45; }
    button { padding: 10px 14px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px; border: 1px solid #2d3540; border-radius: 8px; min-height: 280px; flex: 1; margin: 0; }
    .notice, .status { color: #9fb7d0; font-size: 13px; margin: 6px 0; }
    .status b { color: #e8edf2; }
    .tag { font-size: 12px; color: #ffc27a; }
    .blocked { color: #ffc27a; font-size: 13px; margin: 6px 0; min-height: 18px; }
    #log { flex: 1; overflow-y: auto; border: 1px solid #2d3540; border-radius: 8px; padding: 12px; min-height: 200px; }
    .msg { margin-bottom: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg .who { font-size: 12px; color: #7f8c99; text-transform: uppercase; letter-spacing: .04em; }
    .msg.user .who { color: #8fd0ff; }
    .msg.assistant .who { color: #9ee6b4; }
    .error { color: #ff9b9b; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } section + section { border-left: 0; border-top: 1px solid #2d3540; } }
  </style>
</head>
<body>
  <header>LLM SDK View</header>
  <main>
    <section>
      <h2>Chat</h2>
      <p class="notice">Each turn goes through <code>llm.Conversation</code> and
        <code>llm-anthropic</code>. The right pane shows the request that will
        actually be sent.</p>
      <div id="log"></div>
      <textarea id="prompt" placeholder="Ask a current architecture question..."></textarea>
      <div class="controls">
        <label>Model
          <select id="model"></select>
          <span class="notice" id="contextWindow"></span>
        </label>
        <label>Max output tokens
          <input id="maxTokens" type="number" value="16384" min="1">
          <span class="notice" id="maxTokensHint"></span>
        </label>
        <label>System
          <input id="system" placeholder="omitted from the request when empty">
        </label>
        <label>Thinking
          <select id="thinking"></select>
          <span class="notice" id="thinkingNote"></span>
        </label>
        <label>Thinking budget tokens
          <input id="budgetTokens" type="number" disabled>
          <span class="notice" id="budgetNote"></span>
        </label>
        <label>Effort
          <select id="effort"></select>
          <span class="notice" id="effortNote"></span>
        </label>
        <label>Web search
          <select id="webSearch"><option value="true">ON</option><option value="false">OFF</option></select>
        </label>
        <label>Web search type
          <select id="webSearchType"></select>
          <span class="notice" id="webSearchTypeNote"></span>
        </label>
        <label>Allowed callers
          <select id="allowedCallers"></select>
          <span class="notice" id="allowedCallersNote"></span>
        </label>
        <label>Response inclusion
          <select id="responseInclusion"><option value="excluded">excluded</option><option value="full">full</option></select>
          <span class="notice" id="responseInclusionNote"></span>
        </label>
        <label>Max uses
          <input id="maxUses" type="number" value="1" min="0">
          <span class="notice">0 = unlimited (the field is then omitted)</span>
        </label>
        <label>Prompt cache
          <select id="cacheControl"><option value="true">ON</option><option value="false">OFF</option></select>
          <span class="notice" id="ttlNote"></span>
        </label>
        <label>Streaming
          <select id="stream"><option value="ON">ON</option><option value="OFF">OFF</option></select>
          <span class="notice" id="streamNote"></span>
        </label>
      </div>
      <p class="status">Context: <b id="contextUsage">-</b>
        <span id="contextNote"></span></p>
      <p class="status">Model data: <b id="modelDataSource">-</b>
        <span id="modelDataNote"></span></p>
      <p class="status">Dynamic filtering: <b id="dynamicFiltering">-</b>
        <span id="dynamicFilteringNote"></span></p>
      <p class="blocked" id="blockedNote"></p>
      <button id="send">Send</button>
    </section>
    <section>
      <h2>Anthropic Python SDK</h2>
      <pre id="code">Send a message to see the equivalent SDK call.</pre>
    </section>
  </main>
  <script>
    const byId = (id) => document.getElementById(id);
    const log = byId('log');
    const state = { data: null, caps: null, blocked: false, fits: null };
    let streaming = false;

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = '<div class="who"></div><div class="body"></div>';
      div.querySelector('.who').textContent = role;
      div.querySelector('.body').textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div.querySelector('.body');
    }

    function payload(text) {
      return {
        session_id: 'default',
        text,
        model: byId('model').value,
        max_tokens: Number(byId('maxTokens').value),
        system: byId('system').value,
        thinking: byId('thinking').value,
        effort: byId('effort').value,
        web_search: byId('webSearch').value === 'true',
        web_search_type: byId('webSearchType').value,
        allowed_callers: byId('allowedCallers').value,
        response_inclusion: byId('responseInclusion').value,
        max_uses: Number(byId('maxUses').value),
        cache_control: byId('cacheControl').value === 'true'
      };
    }

    function setOptions(select, options, labels) {
      select.innerHTML = '';
      options.forEach((option) => {
        const el = document.createElement('option');
        el.value = option.value;
        el.textContent = labels[option.value] || option.value;
        el.disabled = !!option.disabled;
        select.appendChild(el);
      });
    }

    const fmt = (n) => (n === null || n === undefined) ? 'unknown' : n.toLocaleString('en-US');

    function effortLabels() {
      const control = state.data.controls.effort;
      const off = byId('thinking').value === 'off';
      const labels = {};
      control.options.forEach((option) => {
        const blocked = off && option.blocked_without_thinking;
        labels[option.value] = option.value === 'default'
          ? (state.caps.default_effort
              ? 'default (model default: ' + state.caps.default_effort + ')'
              : 'default')
          : option.value + (blocked ? ' (rejected with thinking off)' : '');
      });
      return labels;
    }

    function applyEffortState() {
      const control = state.data.controls.effort;
      const off = byId('thinking').value === 'off';
      const labels = effortLabels();
      const options = control.options.map((option) => ({
        value: option.value,
        // A level Anthropic rejects with thinking off is not selectable.
        disabled: !state.caps.supports_effort || (off && option.blocked_without_thinking)
      }));
      setOptions(byId('effort'), options, labels);
      byId('effort').disabled = !state.caps.supports_effort;
      if (byId('effort').selectedOptions[0] && byId('effort').selectedOptions[0].disabled) {
        byId('effort').value = 'default';
      }
      byId('effortNote').textContent = state.caps.supports_effort
        ? '[' + control.status + '] sent as output_config.effort'
        : '[' + control.status + '] ' + control.note;
    }

    function applyThinkingState() {
      const thinking = state.data.controls.thinking;
      const budget = state.data.controls.budget_tokens;
      const on = byId('thinking').value === 'on';

      byId('budgetTokens').value = budget.value === null ? '' : budget.value;
      byId('budgetTokens').disabled = true;
      byId('budgetNote').textContent = (budget.value === null || !on)
        ? '[' + budget.status + '] ' + budget.note
        : '[' + budget.status + '] sent as thinking.budget_tokens; ' + budget.note;

      const control = state.data.controls.max_tokens;
      byId('maxTokens').min = control.min_by_thinking[byId('thinking').value] || 1;
      byId('maxTokensHint').textContent = '[' + control.status + '] ' + control.note
        + (on && budget.value !== null
            ? '; must stay above the ' + budget.value + ' token thinking budget'
            : '');
    }

    function showContext(context) {
      if (!context) return;
      const percent = context.percent === null ? '' : ' (' + context.percent + '%)';
      byId('contextUsage').textContent =
        fmt(context.tokens) + ' / ' + fmt(context.limit) + ' tokens' + percent;
      byId('contextNote').textContent =
        'source: ' + context.source + ' · limit source: ' + context.limit_source
        + ' · ' + fmt(context.reserved) + ' reserved for the reply'
        + (context.fits === false ? ' · does not fit: lower max_tokens or start a new conversation' : '');
      if (context.fits !== undefined) state.fits = context.fits;
      byId('send').disabled = state.blocked || state.fits === false;
    }

    function refresh() {
      const caps = state.caps;
      const on = byId('webSearch').value === 'true';
      ['webSearchType', 'allowedCallers', 'responseInclusion', 'maxUses'].forEach(
        (id) => { byId(id).disabled = !on; }
      );
      byId('responseInclusion').disabled = !on
        || state.data.controls.response_inclusion.status !== 'Editable';

      const callerControl = state.data.controls.allowed_callers;
      const chosen = byId('allowedCallers').value;
      const off = byId('allowedCallers').value === 'direct';
      byId('allowedCallersNote').textContent = off
        ? '[' + 'API supported · not exposed by llm-anthropic' + '] sending is blocked: '
          + 'the request would still use the API default'
        : '[' + callerControl.status + '] ' + callerControl.note;
      state.blocked = off;
      byId('blockedNote').textContent = off ? byId('allowedCallersNote').textContent : '';
      byId('send').disabled = state.blocked || state.fits === false;
    }

    function apply(data) {
      state.data = data;
      const caps = data.capabilities;
      state.caps = caps;
      state.fits = data.context ? data.context.fits : null;

      byId('contextWindow').textContent = 'context window '
        + fmt(caps.context_window) + ' tokens · ' + caps.context_window_source;
      byId('maxTokens').max = caps.max_output_tokens || '';
      byId('maxTokens').value = data.defaults.max_tokens;

      byId('ttlNote').textContent = '[' + data.controls.cache_control.ttl.status + '] '
        + data.controls.cache_control.ttl.value + ' · ' + data.controls.cache_control.ttl.note;

      // Streaming is not a choice here: llm-anthropic always opens a stream.
      const streamControl = data.controls.stream;
      setOptions(byId('stream'), streamControl.options, {
        ON: 'ON', OFF: 'OFF (API supported · not used by llm-anthropic)'
      });
      byId('stream').value = 'ON';
      byId('stream').disabled = true;
      byId('streamNote').textContent = '[' + streamControl.status + '] ' + streamControl.note;

      const src = data.model_data;
      const label = {
        'models-api': {disk: 'Models API (cached)', live: 'Models API (live)',
                       'stale-disk': 'Models API (stale cache)'}[src.cache] || 'Models API',
        fallback: 'fallback profile ' + src.profile_version
      }[src.source] || src.source;
      byId('modelDataSource').textContent = label;
      byId('modelDataNote').textContent = src.source === 'models-api'
        ? 'fetched ' + (src.fetched_at || 'unknown')
        : 'Models API unavailable (' + (src.error || 'unknown') + ') - showing the '
          + src.profile_version + ' profile, not live data';

      // Thinking: its own control, with the official mode and default state.
      const thinkingControl = data.controls.thinking;
      setOptions(byId('thinking'), thinkingControl.options, {
        on: 'ON (' + caps.thinking_mode + ')', off: 'OFF'
      });
      byId('thinking').value = thinkingControl.value;
      byId('thinking').disabled = thinkingControl.status !== 'Editable';
      byId('thinkingNote').textContent = '[' + thinkingControl.status + '] ' + thinkingControl.note;

      applyEffortState();
      applyThinkingState();

      const typeControl = data.controls.web_search_type;
      setOptions(byId('webSearchType'), typeControl.options, {});
      byId('webSearchType').value = typeControl.value || '';
      byId('webSearchType').disabled = true;
      byId('webSearchTypeNote').textContent = '[' + typeControl.status + '] ' + typeControl.note;

      const callerControl = data.controls.allowed_callers;
      const callerLabels = {};
      callerControl.options.forEach((option) => {
        callerLabels[option.value] = option.value + ' (' + option.note + ')';
      });
      setOptions(byId('allowedCallers'), callerControl.options, callerLabels);
      byId('allowedCallers').value = callerControl.value || '';
      byId('allowedCallers').disabled = false;

      const inclusion = data.controls.response_inclusion;
      byId('responseInclusionNote').textContent = '[' + inclusion.status + '] ' + inclusion.note;

      byId('dynamicFiltering').textContent = data.controls.dynamic_filtering.value;
      byId('dynamicFilteringNote').textContent = data.controls.dynamic_filtering.note;

      showContext(data.context);
      refresh();
    }

    async function loadForm() {
      const model = byId('model').value;
      const query = model ? '?model=' + encodeURIComponent(model) : '';
      const response = await fetch('/api/form' + query);
      const data = await response.json();
      if (data.error) {
        byId('blockedNote').textContent = data.error;
        byId('send').disabled = true;
        return;
      }
      if (!byId('model').options.length) {
        setOptions(byId('model'), data.models.map((value) => ({value})), {});
        byId('model').value = data.model.id;
      }
      apply(data);
    }

    ['webSearch', 'webSearchType', 'allowedCallers'].forEach(
      (id) => byId(id).addEventListener('change', refresh)
    );
    byId('thinking').addEventListener('change', () => {
      applyEffortState();
      applyThinkingState();
      refresh();
    });
    byId('model').addEventListener('change', loadForm);

    byId('send').addEventListener('click', async () => {
      if (streaming || byId('send').disabled) return;
      const text = byId('prompt').value.trim();
      if (!text) return;
      streaming = true;
      addMessage('user', text);
      byId('prompt').value = '';
      const body = addMessage('assistant', '');

      const response = await fetch('/api/chat/stream', {
        method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(payload(text))
      });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          const event = JSON.parse(part.slice(6));
          if (event.type === 'prepared') {
            byId('code').textContent = event.code;
            // The truth about dynamic filtering is what went on the request.
            byId('dynamicFiltering').textContent = event.dynamic_filtering;
            byId('dynamicFilteringNote').textContent =
              'read from the request · effective allowed_callers: ' + event.allowed_callers;
            showContext(event.context);
          } else if (event.type === 'text') {
            body.textContent += event.text;
            log.scrollTop = log.scrollHeight;
          } else if (event.type === 'done') {
            body.textContent = event.text;
            state.fits = event.context ? event.context.fits : null;
            showContext(event.context);
            log.scrollTop = log.scrollHeight;
          } else if (event.type === 'error') {
            body.innerHTML = '';
            body.className = 'error';
            body.textContent = event.error === 'missing_api_key'
              ? 'No Anthropic key found. Nothing was sent. Set one with: llm keys set anthropic'
              : event.error;
          }
        }
      }
      streaming = false;
    });

    loadForm();
  </script>
</body>
</html>
